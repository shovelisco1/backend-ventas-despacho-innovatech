name: CI/CD Backends (Ventas y Despachos) a EKS

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: cluster-innovatecha  # <-- Asegúrate de que este sea el nombre exacto de tu clúster EKS

  # --- Variables de VENTAS ---
  ECR_REPO_VENTAS: innovatech-backend-ventas                
  DEPLOYMENT_VENTAS: innovatech-ventas-deployment  # Nombre de tu deployment en K8s
  CONTAINER_VENTAS: innovatech-ventas              # Nombre del contenedor dentro del deployment

  # --- Variables de DESPACHOS ---
  ECR_REPO_DESPACHOS: innovatech-backend-despachos          
  DEPLOYMENT_DESPACHOS: innovatech-despacho-deployment # Nombre de tu deployment en K8s
  CONTAINER_DESPACHOS: innovatech-despacho            # Nombre del contenedor dentro del deployment

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Configurar Credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr 
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================
      # FLUJO PARA VENTAS
      # ==========================================
      - name: 4. [VENTAS] Construir y subir imagen
        id: build-ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPO_VENTAS }}:$IMAGE_TAG ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/${{ env.ECR_REPO_VENTAS }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPO_VENTAS }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ==========================================
      # FLUJO PARA DESPACHOS
      # ==========================================
      - name: 5. [DESPACHOS] Construir y subir imagen
        id: build-despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPO_DESPACHOS }}:$IMAGE_TAG ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/${{ env.ECR_REPO_DESPACHOS }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPO_DESPACHOS }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ==========================================
      # CONEXIÓN Y DESPLIEGUE EN KUBERNETES (EKS)
      # ==========================================
      - name: 6. Configurar acceso al Clúster EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: 7. [VENTAS] Actualizar Imagen en EKS
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_VENTAS }} ${{ env.CONTAINER_VENTAS }}=${{ steps.build-ventas.outputs.image }} -n innovatech

      - name: 8. [DESPACHOS] Actualizar Imagen en EKS
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_DESPACHOS }} ${{ env.CONTAINER_DESPACHOS }}=${{ steps.build-despachos.outputs.image }} -n innovatech

      - name: 9. Verificar estado del despliegue
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_VENTAS }} -n innovatech
          kubectl rollout status deployment/${{ env.DEPLOYMENT_DESPACHOS }} -n innovatech