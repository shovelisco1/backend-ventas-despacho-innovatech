name: CI/CD Backends (Ventas y Despachos) a ECS

on:
  push:
    branches:
      - deploy


env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: cluster-innovatecha

  # --- Variables de VENTAS ---
  ECR_REPO_VENTAS: innovatech-ventas                 
  ECS_SERVICE_VENTAS: service-innovatech-ventas       
  ECS_TASK_DEF_VENTAS: task-innovatech-ventas         
  CONTAINER_VENTAS: app-ventas                        

  # --- Variables de DESPACHOS ---
  ECR_REPO_DESPACHOS: innovatech-despachos            
  ECS_SERVICE_DESPACHOS: service-innovatech-despachos 
  ECS_TASK_DEF_DESPACHOS: task-innovatech-despachos   
  CONTAINER_DESPACHOS: app-despachos                  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Configurar Credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ==========================================
      # FLUJO PARA VENTAS
      # ==========================================
      - name: 4. [VENTAS] Construir y subir imagen
        id: build-ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPO_VENTAS }}:$IMAGE_TAG ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/${{ env.ECR_REPO_VENTAS }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPO_VENTAS }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 5. [VENTAS] Descargar Task Definition actual
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEF_VENTAS }} --query taskDefinition > task-ventas.json

      - name: 6. [VENTAS] Actualizar imagen en Task Definition
        id: render-ventas
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-ventas.json
          container-name: ${{ env.CONTAINER_VENTAS }}
          image: ${{ steps.build-ventas.outputs.image }}

      - name: 7. [VENTAS] Desplegar en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-ventas.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_VENTAS }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ==========================================
      # FLUJO PARA DESPACHOS
      # ==========================================
      - name: 8. [DESPACHOS] Construir y subir imagen
        id: build-despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPO_DESPACHOS }}:$IMAGE_TAG ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/${{ env.ECR_REPO_DESPACHOS }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPO_DESPACHOS }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 9. [DESPACHOS] Descargar Task Definition actual
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEF_DESPACHOS }} --query taskDefinition > task-despachos.json

      - name: 10. [DESPACHOS] Actualizar imagen en Task Definition
        id: render-despachos
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-despachos.json
          container-name: ${{ env.CONTAINER_DESPACHOS }}
          image: ${{ steps.build-despachos.outputs.image }}

      - name: 11. [DESPACHOS] Desplegar en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-despachos.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_DESPACHOS }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true