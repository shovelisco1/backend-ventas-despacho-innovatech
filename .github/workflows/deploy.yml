name: CI/CD Backend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Construir y Subir Imágenes del Backend
        run: |
          docker build -t shovelisco/innovatech-backend-ventas:latest ./back-Ventas_SpringBoot
          docker build -t shovelisco/innovatech-backend-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push shovelisco/innovatech-backend-ventas:latest
          docker push shovelisco/innovatech-backend-despachos:latest

      - name: 4. Desplegar en Instancia EC2 Privada usando Frontend como Puente
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          script: |
            # Nos paramos en el Frontend temporalmente y usamos su consola para saltar al backend privado
            echo "${{ secrets.EC2_SSH_KEY_BACKEND }}" > backend_key.pem
            chmod 400 backend_key.pem

            ssh -o StrictHostKeyChecking=no -i backend_key.pem ubuntu@${{ secrets.EC2_HOST_BACKEND }} << 'EOF'
              cd /home/ubuntu

              # Escribir el docker-compose.yml del backend que guarda la BD y las APIs
              cat << 'OUTER_EOF' > docker-compose.yml
              version: '3.8'
              services:
                db:
                  image: mysql:8.0
                  container_name: mysql-db
                  environment:
                    MYSQL_ROOT_PASSWORD: rootpassword
                    MYSQL_DATABASE: app_db
                    MYSQL_USER: app_user
                    MYSQL_PASSWORD: app_password
                  ports:
                    - "3306:3306"
                  volumes:
                    - db_data:/var/lib/mysql
                  networks:
                    - innovatech_net

                backend-ventas:
                  image: shovelisco/innovatech-backend-ventas:latest
                  container_name: api-ventas
                  ports:
                    - "8080:8080"
                  environment:
                    - DB_ENDPOINT=db
                    - DB_PORT=3306
                    - DB_NAME=app_db
                    - DB_USERNAME=app_user
                    - DB_PASSWORD=app_password
                  depends_on:
                    - db
                  networks:
                    - innovatech_net

                backend-despachos:
                  image: shovelisco/innovatech-backend-despachos:latest
                  container_name: api-despachos
                  ports:
                    - "8081:8081"
                  environment:
                    - DB_ENDPOINT=db
                    - DB_PORT=3306
                    - DB_NAME=app_db
                    - DB_USERNAME=app_user
                    - DB_PASSWORD=app_password
                  depends_on:
                    - db
                  networks:
                    - innovatech_net

              volumes:
                db_data:
                  name: innovatech_db_data

              networks:
                innovatech_net:
                  name: network_backend_innovatech
              OUTER_EOF

              # Reiniciar contenedores
              sudo docker-compose down || true
              sudo docker pull shovelisco/innovatech-backend-ventas:latest
              sudo docker pull shovelisco/innovatech-backend-despachos:latest
              sudo docker-compose up -d
            EOF
            rm -f backend_key.pem