spring.application.name=Springboot-API-REST

# Configuración de la base de datos MySQL en AWS RDS
spring.datasource.url=jdbc:mysql://innovatech-db.cdyvr8j8ttyt.us-east-1.rds.amazonaws.com:3306/app_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.datasource.platform=mysql

# Configuración de Hibernate
spring.jpa.database=mysql
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html